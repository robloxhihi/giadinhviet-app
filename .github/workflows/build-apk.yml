name: Build Android APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write
  # Can de comment bao cao that bai len commit (xem buoc ben duoi).
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        # Robolectric can khong tao duoc sandbox voi compileSdk 36 neu dung JDK 17:
        # "Android SDK 36 requires Java 21 (have Java 17)".
        # AGP 9 van chay duoc tren 21, nen build APK khong bi anh huong.
        java-version: '21'

    # android-actions/setup-android@v3 that cai go "tools" ma Google da go khoi
    # sdkmanager moi -> "Failed to find package 'tools'".
    # Runner ubuntu-latest da co san Android SDK, chi can chan license va
    # cai them platform/build-tools thieu (AGP se tu tai neu duoc phep).
    - name: Prepare Android SDK
      run: |
        echo "ANDROID_HOME=$ANDROID_HOME"
        SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | head -n 1)"
        echo "SDKMGR=$SDKMGR"
        test -n "$SDKMGR"
        echo "SDKMGR=$SDKMGR" >> "$GITHUB_ENV"
        yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
        "$SDKMGR" --list_installed | sed -n '1,60p'
        "$SDKMGR" "platform-tools" "build-tools;36.0.0" "platforms;android-36" || \
          echo "::warning::Thu cai SDK bo sung that bai, de AGP tu giai quyet."

    - name: Point Gradle at the runner SDK
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        cat local.properties

    # Khoa Gemini KHONG nam trong repo. Doi chiem cho ben duoi thanh chuoi that
    # ngay tren may build, ghi vao `.env` — file nay da co trong .gitignore nen
    # khong bao gio bi commit. Secrets plugin (app/build.gradle.kts) doc `.env`
    # va sinh BuildConfig.GEMINI_API_KEY.
    #
    # Quy trinh cho nguoi dung: them Repository Secret ten `GEMINI_API_KEY`
    # (Settings -> Secrets and variables -> Actions) thi APK build tu day co
    # san khoa, mo tro ly AI len chat ngay. Khong co secret thi build van
    # xanh: man hinh AI hoi khoa lan dau tien va luu rieng tren may.
    #
    # Step nay KHONG duoc in gia tri: chi dem do dai va so dong.
    - name: Inject AI keys from repo secrets
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      run: |
        if [ -z "$GEMINI_API_KEY" ]; then
          echo "GEMINI_API_KEY=REPLACE_ME_WITH_YOUR_GEMINI_API_KEY" > .env
          echo "::notice::Chua co repo secret GEMINI_API_KEY - APK se hoi khoa khi mo tro ly AI."
        else
          echo "GEMINI_API_KEY=$GEMINI_API_KEY" > .env
          echo "::notice::Da bom khoa Gemini tu repo secret (do dai ${#GEMINI_API_KEY} ky tu)."
        fi
        if [ -z "$OPENROUTER_API_KEY" ]; then
          echo "OPENROUTER_API_KEY=REPLACE_ME_WITH_YOUR_OPENROUTER_API_KEY" >> .env
          echo "::notice::Chua co repo secret OPENROUTER_API_KEY - model DeepSeek/GLM se hoi khoa trong app."
        else
          echo "OPENROUTER_API_KEY=$OPENROUTER_API_KEY" >> .env
          echo "::notice::Da bom khoa OpenRouter tu repo secret (do dai ${#OPENROUTER_API_KEY} ky tu)."
        fi
        echo "So dong trong .env: $(wc -l < .env)"

    # gradlew + gradle-wrapper.jar da duoc commit vao repo (sinh mot lan bang
    # workflow `.github/workflows/tool-gen-wrapper.yml`, tai ve tu artifact).
    # Truoc day moi lan build phai chay `gradle wrapper` bang system Gradle:
    # 71 giay tai/trung Gradle va sinh file — do an toan, khong lien quan APK.
    - name: Kiem tra Gradle wrapper trong repo
      run: |
        test -f gradlew || { echo "::error::Thieu gradlew trong repo."; exit 1; }
        test -f gradle/wrapper/gradle-wrapper.jar || { echo "::error::Thieu gradle-wrapper.jar."; exit 1; }
        chmod +x gradlew
        echo "wrapper jar: $(sha256sum gradle/wrapper/gradle-wrapper.jar)"

    # Cache ~/.gradle day du (dependencies + local build cache + distribution).
    # Do lan chay 40190751706: `actions/caches total_count 0` = moi lan chay
    # nguoi hoan toan. Buoc nay in "Restored" thi truong hop nao cung tiet
    # kiem 1-2 phut; in "miss" thi khong hai gi. Khong dung
    # gradle/actions/setup-gradle nua vi no quan ly cung duong dan do -> hai
    # bo dem cung ghi mot noi, de mot bo dem duy nhat noi day.
    - name: Cache ~/.gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
          ~/.gradle/native
        key: gradle-${{ runner.os }}-9.3.1-${{ hashFiles('**/*.gradle.kts', 'settings.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
        restore-keys: |
          gradle-${{ runner.os }}-9.3.1-
          gradle-${{ runner.os }}-

    - name: Test va build ca hai APK (mot lan go Gradle)
      # That bai o test thi khong con nghia gi dang APK: BlockPolicy quyet dinh
      # cai gi bi khoa tren may hoc sinh. Gradle chay theo thu tu task nen
      # :app:assembleDebug va :admin:assembleDebug khong chay neu test do.
      # Gop ba invocation thanh mot tiet kiem hai lan tai Gradle daemon +
      # hai lan phan tich (configuration) du an.
      run: |
        ./gradlew :app:testDebugUnitTest :app:assembleDebug :admin:assembleDebug \
          --stacktrace --warning-mode all

    - name: In ket qua test khi do
      if: failure()
      run: |
        find app/build/test-results -name '*.xml' -print0 2>/dev/null |
          xargs -0 -I{} sh -c 'echo "===== {} ====="; cat "{}"' || true

    # Log cua GitHub Actions chi doc duoc sau khi dang nhap. Khi do, bao cao
    # that bai duoc dang thanh comment CONG KHAI ngay tren commit de ben agent
    # doc duoc ma khong can tai khoan cua ban. Chi chay khi do, khong anh
    # huong ban APK.
    - name: Dang bao cao that bai cong khai tren commit
      if: failure()
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        {
          echo "### Run $GITHUB_RUN_NUMBER do (tag/branch $GITHUB_REF_NAME)"
          echo
          echo '```'
          for f in $(find app/build/test-results -name '*.xml' 2>/dev/null); do
            grep -Eo 'testcase name="[^"]+"|<failure message="[^"]{0,200}' "$f" | head -40 || true
          done
          ./gradlew :app:testDebugUnitTest --console=plain 2>&1 |
            grep -E '^e: |FAILED|error:|Unresolved' | head -40 || true
          echo '```'
        } > /tmp/fail.md || true
        wc -c /tmp/fail.md
        python3 - <<'PY'
        import json, os, urllib.request
        body = open('/tmp/fail.md', encoding='utf-8', errors='replace').read()[:55000]
        url = "https://api.github.com/repos/%s/commits/%s/comments" % (
            os.environ['GITHUB_REPOSITORY'], os.environ['GITHUB_SHA'])
        req = urllib.request.Request(url,
                                     data=json.dumps({'body': body}).encode(),
                                     method='POST',
                                     headers={'Authorization': 'token ' + os.environ['GH_TOKEN'],
                                              'Accept': 'application/vnd.github+json',
                                              'Content-Type': 'application/json',
                                              'User-Agent': 'ci-failure-report'})
        try:
            with urllib.request.urlopen(req) as r:
                print('Da dang bao cao:', r.json().get('html_url'))
        except Exception as e:
            print('Khong dang duoc bao cao:', e)
        PY

    - name: Rename APK
      run: |
        cp app/build/outputs/apk/debug/app-debug.apk GiaDinhViet.apk
        cp admin/build/outputs/apk/debug/admin-debug.apk QuanTriVien.apk
        ls -la GiaDinhViet.apk QuanTriVien.apk
        sha256sum GiaDinhViet.apk QuanTriVien.apk

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: GiaDinhViet
        path: |
          GiaDinhViet.apk
          QuanTriVien.apk
        if-no-files-found: error

    # Chi chay khi day tag dang v* (vi du v3) -> tao Release tai file APK
    - name: Publish release with APK
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          GiaDinhViet.apk
          QuanTriVien.apk
        prerelease: true
        generate_release_notes: true
        body: |
          Ban debug — ky bang debug keystore, chua phat hanh tren CH Play.

          Tai ve: **GiaDinhViet.apk**
          https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/GiaDinhViet.apk

          **Loi cai:** go ban cu truoc khi cai ban nay, vi may co the khac chu ky
          (INSTALL_FAILED_UPDATE_INCOMPATIBLE).

          Ban nay CO bo chan ung dung (AccessibilityService). Nguoi dung phai tu bat:
          Cai dat -> Tro nang tiep can -> Gia Dinh Viet.

          Trang gioi thieu: https://giadinhviet-9eud03puq7u.qoder.website

    # SHA-1/SHA-256 tu dong vao Firebase: chu ky (can cho "Dang nhap Google")
    # va hash cua chinh file APK (de web/app doi chieu file tai ve).
    # Chay khi co FIREBASE_SA_JSON; khong co secret thi in mot thong bao roi
    # bo qua — build va release van xanh, khong gia nan da ghi duoc.
    - name: Ghi SHA cua ca hai ban APK vao Firebase
      if: startsWith(github.ref, 'refs/tags/v')
      env:
        FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SA_JSON }}
      run: |
        KT_OUT="$(keytool -list -v -keystore debug.keystore -storepass android 2>/dev/null)"
        CERT_SHA1="$(printf '%s\n' "$KT_OUT" | sed -n 's/^[[:space:]]*SHA1: //p' | head -1)"
        CERT_SHA256="$(printf '%s\n' "$KT_OUT" | sed -n 's/^[[:space:]]*SHA256: //p' | head -1)"
        echo "Chu ky debug: SHA1=${CERT_SHA1:-<khong doc duoc>}"
        # App nguoi dung: tai lieu release_hashes/<tag>.
        CERT_SHA1="$CERT_SHA1" CERT_SHA256="$CERT_SHA256" node scripts/firebase-release-attest.mjs GiaDinhViet.apk "$GITHUB_REF_NAME"
        # App Quan Tri Vien: module rieng, APK rieng -> tai lieu <tag>-admin,
        # de web doi chieu duoc file nao tai ve la file nao.
        CERT_SHA1="$CERT_SHA1" CERT_SHA256="$CERT_SHA256" node scripts/firebase-release-attest.mjs QuanTriVien.apk "$GITHUB_REF_NAME-admin"
