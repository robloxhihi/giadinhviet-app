# Chay MOT LAN de lay ba file wrapper (`gradlew`, `gradlew.bat`,
# `gradle/wrapper/gradle-wrapper.jar`) tu dung ban Gradle 9.3.1 ma repo dang
# tro toi, roi upload thanh artifact nhe (~120 KB) de commit vao repo.
#
# Ly do ton tai workflow nay: repo KHONG co wrapper, nen moi lan build phai
# chay `gradle wrapper` (buoc "Ensure Gradle Wrapper exists", do duoc 71 s),
# sau do `./gradlew` lai tai tiep distribution lan thu hai. Sinh wrapper bang
# CI la cach duy nhat khong can Android SDK va khong can Gradle tren may
# nguoi dung — may nay `~/.gradle` = 0 MB, `Android/Sdk` = 0 MB.
#
# Chi kich hoat bang workflow_dispatch; nam yen thi khong anh huong build APK.

name: Tool - sinh Gradle wrapper

on:
  workflow_dispatch:
    inputs:
      gradle_version:
        description: 'Phien ban Gradle can sinh wrapper'
        required: false
        default: '9.3.1'

permissions:
  contents: read

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # Runner ubuntu-latest co san `gradle` trong image; dung no de sinh
      # wrapper cho dung phien ban ghi trong gradle/wrapper/gradle-wrapper.properties.
      - name: Sinh wrapper
        run: |
          set -e
          gradle --version | sed -n '1,12p'
          VER="${{ github.event.inputs.gradle_version }}"
          gradle wrapper --gradle-version "$VER" --distribution-type bin
          ls -la gradlew gradlew.bat gradle/wrapper/
          echo "--- gradle-wrapper.properties ---"
          cat gradle/wrapper/gradle-wrapper.properties
          echo "--- kiem tra wrapper jar (phai co GradleWrapperMain) ---"
          unzip -l gradle/wrapper/gradle-wrapper.jar | sed -n '1,20p'
          test "$(unzip -l gradle/wrapper/gradle-wrapper.jar | grep -c GradleWrapperMain)" -ge 1
          echo "SHA-256 cua jar: $(sha256sum gradle/wrapper/gradle-wrapper.jar | cut -d' ' -f1)"

      - name: Choi wrapper chay that
        # Loi duy nhat phat hien o day: wrapper tai dung phien ban va gradlew
        # thuc thi duoc tren runner Linux.
        run: ./gradlew --version | sed -n '1,15p'

      - name: Upload wrapper
        uses: actions/upload-artifact@v4
        with:
          name: gradle-wrapper
          path: |
            gradlew
            gradlew.bat
            gradle/wrapper/gradle-wrapper.jar
            gradle/wrapper/gradle-wrapper.properties
          if-no-files-found: error
